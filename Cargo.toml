[package]
name = "roadie"
version = "0.2.0"
edition = "2021"
description = "Kanban TUI over GitHub Issues, driven by the `roadmap` CLI"

[[bin]]
name = "roadie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
