[package]
name = "roadie"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Kanban TUI over GitHub Issues, driven by the `roadmap` CLI"

[[bin]]
name = "roadie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"
